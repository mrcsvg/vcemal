[project]
name = "vcemal"
version = "0.1.0"
description = "Remuneracao por peca em plataformas de entrega e internacoes de motociclistas no SUS"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2",
  "pyarrow>=16",
  "duckdb>=1.0",
  "pysus>=2.11",
  "numpy>=1.26",
  "xlrd>=2.0",
  "openpyxl>=3.1",
  "matplotlib>=3.8",
  "statsmodels>=0.14",
  "scipy>=1.11",
  "linearmodels>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "pre-commit>=3.8", "jupyterlab>=4"]
# Segunda fonte do SIH, opcional: ver D-018
bq = ["google-cloud-bigquery>=3.20", "db-dtypes>=1.2"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
